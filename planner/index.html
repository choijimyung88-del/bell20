<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플래너">
<meta name="theme-color" content="#f4f1ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>데일리 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
/* Layout: one paper page that fits the tablet screen (no scrolling, so a passive stylus can write anywhere).
   Header (date + progress) → tool bar → grid of six sections; each section is ruled paper with a
   check-mark gutter on the left and a handwriting canvas on the right. */
:root{
  color-scheme:light;
  --paper:#f4f1ea; --card:#fffdf9; --ink:#1f2421; --muted:#8b8579; --faint:#bdb6a8;
  --rule:#e9e3d7; --line:#e0d9cc; --accent:#2f5d50; --accent-soft:#e2ebe6;
  --dawn:#cf6f43; --dawn-soft:#f7e6dc;
  --lh:38px; --gw:40px;
  --f-serif:"Noto Serif KR",Georgia,serif;
  --f-sans:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}

.app{
  height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto 1fr;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  gap:10px;max-width:1100px;margin:0 auto;
}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.date-wrap{display:flex;align-items:center;gap:4px;min-width:0}
.nav{width:36px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.nav:active{background:var(--rule)}
.nav svg{width:22px;height:22px}
.date{display:flex;align-items:center;gap:12px;padding:2px 6px;border-radius:12px;text-align:left;min-width:0}
.d-num{font-family:var(--f-serif);font-weight:700;font-size:36px;line-height:1;letter-spacing:-.01em;font-variant-numeric:lining-nums}
.d-meta{display:flex;flex-direction:column;line-height:1.25}
.d-meta b{font-family:var(--f-serif);font-weight:700;font-size:15px}
.d-meta span{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.today-btn{margin-left:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--muted);background:var(--card)}
.today-btn[aria-current="date"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.prog{display:flex;align-items:center;gap:8px;flex:none}
.prog svg{width:40px;height:40px;transform:rotate(-90deg)}
.prog circle{fill:none;stroke-width:4}
.prog .bg{stroke:var(--line)}
.prog .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.prog-t{display:flex;flex-direction:column;line-height:1.2}
.prog-t b{font-family:var(--f-serif);font-size:17px;font-variant-numeric:tabular-nums}
.prog-t b small{font-size:12px;color:var(--muted);font-weight:500}
.prog-t span{font-size:10px;letter-spacing:.14em;color:var(--muted)}

/* ---------- tool bar ---------- */
.tools{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 6px;box-shadow:0 1px 0 rgba(31,36,33,.03)}
.tgroup{display:flex;align-items:center;gap:2px}
.tsep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.flex{flex:1}
.tool{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:disabled{opacity:.28}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sw i{width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{background:none}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.sz i{width:var(--d);height:var(--d);border-radius:50%;background:currentColor}
.mode-chip{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.mode-chip b{color:var(--accent);font-weight:500}

/* ---------- page grid ---------- */
.grid{
  min-height:0;display:grid;gap:10px;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto 1fr 1fr 1fr;
  grid-template-areas:"wake wake" "goal morning" "today important" "today tomorrow";
}
@media (orientation:landscape) and (min-width:820px){
  .grid{grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto 1fr 1fr;
    grid-template-areas:"wake wake wake" "goal today important" "morning today tomorrow"}
}
@media (max-width:520px){
  .app{grid-template-rows:auto auto minmax(0,1fr)}
  .grid{overflow:auto;touch-action:pan-y;grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:auto;
    grid-template-areas:"wake" "goal" "morning" "today" "important" "tomorrow"}
  .grid .sheet{min-height:calc(var(--lh) * 4)}
  .grid .sec[data-id="today"] .sheet{min-height:calc(var(--lh) * 7)}
  .mode-chip{display:none}
}
@media (max-width:640px){ .mode-chip{display:none} .tool{width:36px} }

.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;box-shadow:0 1px 2px rgba(31,36,33,.04)}
.sec-h{display:flex;align-items:baseline;gap:8px;padding:10px 14px 6px;flex:none;touch-action:pan-y}
.sec-h h2{margin:0;font-family:var(--f-serif);font-weight:700;font-size:15px;letter-spacing:-.01em}
.sec-h .en{font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.sec-h .x{margin-left:auto;display:flex;align-items:center;gap:6px}
.mini{height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;color:var(--dawn);background:var(--dawn-soft)}
.sec[data-id="important"] h2{color:#9a3d33}
.sec[data-id="goal"] h2{color:var(--accent)}

.sheet{
  position:relative;flex:1;min-height:0;
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));
  background-size:100% var(--lh);background-repeat:repeat-y;
}
.sheet canvas{position:absolute;top:0;bottom:0;right:0;left:var(--gw);width:calc(100% - var(--gw));height:100%;touch-action:none}
.sec[data-kind="goal"]{--gw:16px}
.sec[data-kind="goal"] .sheet::before{content:"";position:absolute;left:14px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent);opacity:.35}
.gutter{position:absolute;left:0;top:0;width:var(--gw);height:100%}
.dims{position:absolute;inset:0 0 0 var(--gw);pointer-events:none}
.dims i{position:absolute;left:0;right:0;height:calc(var(--lh) - 1px);background:linear-gradient(to right,rgba(255,253,249,.55),rgba(255,253,249,.55))}
.mk{position:absolute;left:0;width:var(--gw);height:var(--lh);display:grid;place-items:center;touch-action:manipulation}
.mk span{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);transition:background .15s,border-color .15s}
.mk.has span{border-color:var(--faint)}
.mk svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mk[data-s="1"] span{background:var(--accent);border-color:var(--accent);color:#fff}
.mk[data-s="2"] span{background:var(--dawn-soft);border-color:var(--dawn);color:var(--dawn)}
.mk[data-s="2"] svg{stroke:var(--dawn)}
.sec[data-kind="num"] .mk span{border-radius:50%;font-family:var(--f-serif)}
.sec[data-kind="num"] .mk[data-s="1"] span{background:#9a3d33;border-color:#9a3d33}

/* ---------- wake strip ---------- */
.wake .sec-h{align-items:center;padding-bottom:2px}
.wake .sec-h .x{font-size:12px;color:var(--muted);gap:12px}
.wake .sec-h .x b{font-family:var(--f-serif);color:var(--dawn);font-size:14px}
.wake-body{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:2px 14px 12px}
.tbox{display:flex;flex-direction:column;gap:0;padding:4px 12px 6px;border-radius:12px;background:var(--paper);min-width:104px}
.tbox span{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.tbox input{font-family:var(--f-serif);font-weight:700;font-size:22px;line-height:1.2;color:var(--ink);background:none;border:0;padding:0;width:100%;-webkit-user-select:text;user-select:text}
.tbox input::-webkit-calendar-picker-indicator{display:none}
.tbox.goal input{color:var(--accent)}
.wake-btn{height:44px;padding:0 16px;border-radius:12px;background:var(--dawn);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.wake-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.wake-btn:disabled{background:var(--rule);color:var(--faint)}
.wake-res{font-size:13px;color:var(--muted);min-width:96px}
.wake-res b{display:block;font-family:var(--f-serif);font-size:15px;color:var(--ink)}
.wake-res.ok b{color:var(--accent)}
.wake-res.late b{color:var(--dawn)}
.week{display:flex;gap:2px}
.wd{width:28px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;border-radius:8px;font-size:10px;color:var(--muted)}
.wd i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line)}
.wd.ok i{background:var(--accent);border-color:var(--accent)}
.wd.late i{background:var(--dawn-soft);border-color:var(--dawn)}
.wd.sel{background:var(--paper);color:var(--ink);font-weight:700}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;border-radius:20px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(31,36,33,.25);max-width:min(560px,calc(100vw - 32px));width:100%;max-height:calc(100dvh - 48px)}
dialog::backdrop{background:rgba(31,36,33,.32)}
.dlg{padding:20px 22px 22px;display:flex;flex-direction:column;gap:18px;overflow:auto;max-height:calc(100dvh - 48px)}
.dlg h3{margin:0;font-family:var(--f-serif);font-size:19px;display:flex;justify-content:space-between;align-items:center}
.dlg h4{margin:0 0 8px;font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:500}
.close{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--paper);padding:4px;border-radius:12px}
.seg button{padding:10px 6px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(31,36,33,.12)}
.hint{margin:8px 2px 0;font-size:12px;color:var(--muted);line-height:1.6}
.hint b{color:var(--accent);font-weight:500}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:44px;border-radius:12px;border:1px solid var(--line);font-size:13px;font-weight:500;background:var(--card)}
.btn.warn{color:#9a3d33}
.howto{margin:0;padding-left:18px;font-size:13px;color:#4a4a44;line-height:1.75}
.howto b{font-weight:700}
.yd-sheet{position:relative;border-radius:12px;border:1px solid var(--line);background-color:var(--card);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));background-size:100% var(--lh);overflow:hidden;margin:0 auto}
.yd-sheet canvas{display:block}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;transition:.25s;pointer-events:none;z-index:9;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="date-wrap">
      <button class="nav" id="prev" aria-label="이전 날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="date" id="dateBtn" aria-label="날짜 선택">
        <span class="d-num" id="dNum">--.--</span>
        <span class="d-meta"><b id="dDow">요일</b><span id="dSub">----</span></span>
      </button>
      <button class="nav" id="next" aria-label="다음 날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="today-btn" id="todayBtn">오늘</button>
      <input type="date" id="datePick" class="sr" tabindex="-1" aria-hidden="true">
    </div>
    <div class="prog" aria-label="오늘 완료율">
      <svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="fg" id="progArc" cx="20" cy="20" r="16" stroke-dasharray="100.53" stroke-dashoffset="100.53"/></svg>
      <div class="prog-t"><b id="progN">0<small>/0</small></b><span>DONE</span></div>
    </div>
  </header>

  <nav class="tools" aria-label="필기 도구">
    <div class="tgroup">
      <button class="tool sw" data-color="ink" aria-label="검정 펜"><i style="--c:#1f2421"></i></button>
      <button class="tool sw" data-color="navy" aria-label="남색 펜"><i style="--c:#284a7a"></i></button>
      <button class="tool sw" data-color="red" aria-label="빨간 펜"><i style="--c:#b5443a"></i></button>
      <button class="tool" id="tHl" aria-label="형광펜"><svg viewBox="0 0 24 24"><path d="M3 21h8" stroke="#e9c443" stroke-width="3"/><path d="m9 13 7-9 4 3-7 9"/><path d="m9 13-2 4 2 1.5 4-2.5"/></svg></button>
      <button class="tool" id="tEr" aria-label="지우개"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.6 15.4 13.4 6.6a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L10 20H8.8z"/><path d="m9 11 4.6 4.6"/></svg></button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tool sz" data-size="0" aria-label="가는 펜"><i style="--d:4px"></i></button>
      <button class="tool sz" data-size="1" aria-label="보통 펜"><i style="--d:7px"></i></button>
      <button class="tool sz" data-size="2" aria-label="굵은 펜"><i style="--d:10px"></i></button>
    </div>
    <span class="tsep"></span>
    <div class="tgroup">
      <button class="tool" id="undo" aria-label="실행 취소" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="tool" id="redo" aria-label="다시 실행" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <span class="flex"></span>
    <span class="mode-chip" id="modeChip"></span>
    <button class="tool" id="menuBtn" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  </nav>

  <main class="grid" id="grid">
    <section class="sec wake" style="grid-area:wake">
      <header class="sec-h"><h2>새벽기상</h2><span class="en">01 · Rise</span><span class="x"><span id="streak"></span><span class="week" id="week"></span></span></header>
      <div class="wake-body">
        <label class="tbox goal"><span>목표</span><input type="time" id="wTarget"></label>
        <label class="tbox"><span>기상</span><input type="time" id="wActual"></label>
        <button class="wake-btn" id="wNow"><svg viewBox="0 0 24 24"><path d="M12 3v3M5.6 7.6 4.2 6.2M18.4 7.6l1.4-1.4M3 16h18M7 16a5 5 0 0 1 10 0M8 20h8"/></svg>지금 기상</button>
        <div class="wake-res" id="wRes"></div>
      </div>
    </section>
  </main>
</div>

<dialog id="menu">
  <div class="dlg">
    <h3>설정 <button class="close" data-close aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h3>
    <div>
      <h4>입력 방식</h4>
      <div class="seg" id="modeSeg">
        <button data-mode="auto">자동</button>
        <button data-mode="touch">터치펜 · 손가락</button>
        <button data-mode="pen">액티브 펜 전용</button>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>
    <div>
      <h4>보기</h4>
      <div class="rows"><button class="btn" id="fsBtn">전체 화면</button><button class="btn warn" id="clearBtn">이 날 페이지 비우기</button></div>
    </div>
    <div>
      <h4>백업</h4>
      <div class="rows"><button class="btn" id="expBtn">백업 파일 저장</button><button class="btn" id="impBtn">백업 불러오기</button></div>
      <input type="file" id="impFile" accept="application/json,.json" hidden>
      <p class="hint">기록은 이 태블릿 브라우저 안에만 저장돼요. 가끔 백업 파일을 저장해 두세요.</p>
    </div>
    <div>
      <h4>사용법</h4>
      <ol class="howto">
        <li>각 칸의 줄 위에 <b>펜으로 바로</b> 쓰세요.</li>
        <li>왼쪽 네모를 톡 누를 때마다 <b>완료(✓)</b>, <b>미룸(→)</b>, 빈칸 순으로 바뀌어요. 중요한 일은 번호를 누르면 완료돼요.</li>
        <li>펜 옆 버튼(지우개 버튼)이나 <b>지우개 도구</b>로 획을 문지르면 지워져요.</li>
        <li>‘당일 할일’의 <b>어제 적은 일</b>을 누르면 전날 ‘다음날 할일’을 볼 수 있어요.</li>
      </ol>
    </div>
  </div>
</dialog>

<dialog id="yd">
  <div class="dlg">
    <h3><span>어제 적은 다음날 할일</span><button class="close" data-close aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h3>
    <div class="yd-sheet" id="ydSheet"><canvas id="ydCanvas"></canvas></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const LH = 38;                 // ruled line height (CSS px) — matches --lh
const KEY = 'dp:';
const SECS = [
  {id:'goal',      title:'목표',       en:'02 · Goal',     kind:'goal'},
  {id:'morning',   title:'아침 할일',  en:'03 · Morning',  kind:'check'},
  {id:'today',     title:'당일 할일',  en:'04 · Today',    kind:'check'},
  {id:'important', title:'중요한 일',  en:'05 · Priority', kind:'num'},
  {id:'tomorrow',  title:'다음날 할일', en:'06 · Tomorrow', kind:'check'},
];
const PROGRESS_IDS = ['morning','today','important'];
const PENS = {ink:'#1f2421', navy:'#284a7a', red:'#b5443a'};
const HL_COLOR = '#f2cf57';
const PEN_W = [1.5, 2.4, 3.6], HL_W = [12, 18, 26];
const DOW = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
const DOW_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const ICON_MOVE = '<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };

function load(k){ try { return JSON.parse(localStorage.getItem(KEY + k)); } catch (e) { return null; } }
function store(k, v){
  try { localStorage.setItem(KEY + k, JSON.stringify(v)); }
  catch (e) { toast('저장 공간이 부족해요. 백업 후 오래된 페이지를 비워 주세요.'); }
}

/* ---------- settings & day data ---------- */
const S = Object.assign({input:'auto', penSeen:false, tool:'pen', color:'ink', size:1, target:'05:00'}, load('settings') || {});
const saveSettings = () => store('settings', S);

let cur = today0();
let day = null;
let undoS = [], redoS = [];

function emptyDay(){
  const s = {};
  SECS.forEach(x => s[x.id] = {k:[], m:{}});
  return {wake:{target:S.target, actual:''}, s};
}
function loadDay(key){
  const d = load(key), e = emptyDay();
  if (!d) return e;
  d.wake = Object.assign(e.wake, d.wake || {});
  d.s = d.s || {};
  SECS.forEach(x => d.s[x.id] = Object.assign({k:[], m:{}}, d.s[x.id] || {}));
  return d;
}
function isEmpty(d){
  if (d.wake.actual) return false;
  return SECS.every(x => !d.s[x.id].k.length && !Object.keys(d.s[x.id].m).length);
}
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 300); }
function saveNow(){
  clearTimeout(saveT);
  if (!day) return;
  const key = ymd(cur);
  if (isEmpty(day)) { try { localStorage.removeItem(KEY + key); } catch (e) {} }
  else store(key, day);
}

/* ---------- build sections ---------- */
const grid = $('#grid');
const secs = {};
const dpr = () => Math.min(window.devicePixelRatio || 1, 3);

SECS.forEach(def => {
  const el = document.createElement('section');
  el.className = 'sec';
  el.dataset.id = def.id;
  el.dataset.kind = def.kind;
  el.style.gridArea = def.id;
  el.innerHTML = `<header class="sec-h"><h2>${def.title}</h2><span class="en">${def.en}</span><span class="x"></span></header>
    <div class="sheet"><div class="gutter"></div><canvas></canvas><div class="dims"></div></div>`;
  grid.appendChild(el);
  const canvas = el.querySelector('canvas');
  const cache = document.createElement('canvas');
  const sec = {def, id:def.id, el, canvas, ctx:canvas.getContext('2d'), cache, cctx:cache.getContext('2d'),
    gutter:el.querySelector('.gutter'), dims:el.querySelector('.dims'), W:1, H:1, n:1};
  secs[def.id] = sec;
  bindCanvas(sec);
  sec.gutter.addEventListener('click', e => {
    const b = e.target.closest('.mk');
    if (!b || def.kind === 'goal') return;
    const i = +b.dataset.i, m = day.s[def.id].m;
    const next = def.kind === 'num' ? ((m[i] || 0) ? 0 : 1) : (((m[i] || 0) + 1) % 3);
    if (next) m[i] = next; else delete m[i];
    if (next === 1 && navigator.vibrate) navigator.vibrate(8);
    renderMarks(sec); updateProgress(); save();
  });
  new ResizeObserver(() => layout(sec)).observe(canvas);
});

// "어제 적은 일" shortcut lives in the 당일 할일 header
const ydBtn = document.createElement('button');
ydBtn.className = 'mini'; ydBtn.textContent = '어제 적은 일'; ydBtn.hidden = true;
secs.today.el.querySelector('.x').appendChild(ydBtn);
ydBtn.addEventListener('click', showYesterday);

function layout(sec){
  const W = sec.canvas.clientWidth, H = sec.canvas.clientHeight;
  if (!W || !H) return;
  const r = dpr();
  [sec.canvas, sec.cache].forEach(c => { c.width = Math.round(W * r); c.height = Math.round(H * r); });
  sec.W = W; sec.H = H;
  sec.n = Math.max(1, Math.floor(H / LH));
  render(sec);
}

/* ---------- ink rendering ---------- */
const wAt = (s, pr, W) => s.w * W * (0.35 + 0.9 * pr) / 0.8;

function piece(c, s, p, i, W){
  const x0 = p[(i-1)*3] * W, y0 = p[(i-1)*3+1] * W, x1 = p[i*3] * W, y1 = p[i*3+1] * W;
  c.lineWidth = wAt(s, (p[(i-1)*3+2] + p[i*3+2]) / 2, W);
  c.beginPath();
  if (i === 1) { c.moveTo(x0, y0); c.lineTo((x0 + x1) / 2, (y0 + y1) / 2); }
  else {
    const xa = p[(i-2)*3] * W, ya = p[(i-2)*3+1] * W;
    c.moveTo((xa + x0) / 2, (ya + y0) / 2);
    c.quadraticCurveTo(x0, y0, (x0 + x1) / 2, (y0 + y1) / 2);
  }
  c.stroke();
}
function tail(c, s, p, W){
  const n = p.length / 3;
  if (n < 2) return;
  const i = n - 1, x0 = p[(i-1)*3] * W, y0 = p[(i-1)*3+1] * W, x1 = p[i*3] * W, y1 = p[i*3+1] * W;
  c.lineWidth = wAt(s, p[i*3+2], W);
  c.beginPath(); c.moveTo((x0 + x1) / 2, (y0 + y1) / 2); c.lineTo(x1, y1); c.stroke();
}
function penStyle(c, s){ c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = c.fillStyle = s.c; }
function drawStroke(c, s, W){
  const p = s.p, n = p.length / 3;
  if (!n) return;
  if (s.t === 'hl') {
    c.save();
    c.globalAlpha = .55; c.globalCompositeOperation = 'multiply';
    c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = s.c; c.lineWidth = s.w * W;
    c.beginPath(); c.moveTo(p[0] * W, p[1] * W);
    if (n === 1) c.lineTo(p[0] * W + .01, p[1] * W);
    for (let i = 1; i < n; i++) {
      const x0 = p[(i-1)*3] * W, y0 = p[(i-1)*3+1] * W, x1 = p[i*3] * W, y1 = p[i*3+1] * W;
      c.quadraticCurveTo(x0, y0, (x0 + x1) / 2, (y0 + y1) / 2);
    }
    if (n > 1) c.lineTo(p[(n-1)*3] * W, p[(n-1)*3+1] * W);
    c.stroke(); c.restore();
    return;
  }
  penStyle(c, s);
  if (n === 1) { c.beginPath(); c.arc(p[0] * W, p[1] * W, wAt(s, p[2], W) / 2, 0, Math.PI * 2); c.fill(); return; }
  for (let i = 1; i < n; i++) piece(c, s, p, i, W);
  tail(c, s, p, W);
}
function paint(c, canvas, strokes, W){
  const r = canvas.width / W;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, canvas.width, canvas.height);
  c.setTransform(r, 0, 0, r, 0, 0);
  strokes.forEach(s => s.t === 'hl' && drawStroke(c, s, W));   // highlighter sits under the ink
  strokes.forEach(s => s.t !== 'hl' && drawStroke(c, s, W));
}
function blit(sec){
  const c = sec.ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, sec.canvas.width, sec.canvas.height);
  c.drawImage(sec.cache, 0, 0);
  const r = sec.canvas.width / sec.W;
  c.setTransform(r, 0, 0, r, 0, 0);
}
function render(sec){
  if (!day) return;
  paint(sec.cctx, sec.cache, day.s[sec.id].k, sec.W);
  blit(sec);
  renderMarks(sec);
}

/* lines that carry ink — used for the progress count and to emphasise their check boxes */
function inkLines(sec){
  const set = new Set();
  for (const s of day.s[sec.id].k) {
    if (s.t === 'hl') continue;
    let lo = Infinity, hi = -Infinity;
    for (let i = 1; i < s.p.length; i += 3) { if (s.p[i] < lo) lo = s.p[i]; if (s.p[i] > hi) hi = s.p[i]; }
    set.add(Math.floor((lo + hi) / 2 * sec.W / LH));
  }
  return set;
}
function renderMarks(sec){
  const {def} = sec, m = day.s[sec.id].m;
  if (def.kind === 'goal') { sec.gutter.innerHTML = ''; return; }
  const ink = inkLines(sec);
  let g = '', d = '';
  for (let i = 0; i < sec.n; i++) {
    const st = m[i] || 0;
    const inner = st === 1 ? (def.kind === 'num' ? i + 1 : ICON_CHECK) : st === 2 ? ICON_MOVE : (def.kind === 'num' ? i + 1 : '');
    const label = st === 1 ? '완료' : st === 2 ? '미룸' : '미완료';
    g += `<button class="mk${ink.has(i) ? ' has' : ''}" data-i="${i}" data-s="${st}" style="top:${i * LH}px" aria-label="${i + 1}번째 줄 ${label}"><span>${inner}</span></button>`;
    if (st === 1) d += `<i style="top:${i * LH}px"></i>`;
  }
  sec.gutter.innerHTML = g;
  sec.dims.innerHTML = d;
}
function updateProgress(){
  let total = 0, done = 0;
  PROGRESS_IDS.forEach(id => {
    const sec = secs[id], m = day.s[id].m, ink = inkLines(sec);
    for (let i = 0; i < sec.n; i++) {
      if (ink.has(i) || m[i]) total++;
      if (m[i] === 1) done++;
    }
  });
  $('#progN').innerHTML = `${done}<small>/${total}</small>`;
  const C = 100.53;
  $('#progArc').setAttribute('stroke-dashoffset', total ? C * (1 - done / total) : C);
}

/* ---------- pen / touch input ---------- */
let act = null;      // the one pointer currently drawing or erasing
let frame = 0;

function accept(e){
  if (e.pointerType === 'pen') {
    if (!S.penSeen) { S.penSeen = true; saveSettings(); renderMode(); }
    return true;
  }
  if (e.pointerType === 'mouse') return e.button === 0;
  // touch: a passive (capacitive) stylus also arrives as touch
  if (S.input === 'pen') return false;
  if (S.input === 'auto' && S.penSeen) return false;
  if (Math.max(e.width || 0, e.height || 0) > 60) return false;   // palm-sized contact
  return true;
}
function isEraser(e){ return S.tool === 'eraser' || e.button === 5 || (e.buttons & 32) === 32; }

function bindCanvas(sec){
  const cv = sec.canvas;
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => {
    if (!accept(e)) return;
    if (act) {
      // a palm or finger touched first and then the pen landed: drop the touch stroke, keep the pen
      if (act.ptype === 'touch' && e.pointerType === 'pen') cancelAct(); else return;
    }
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    const rect = cv.getBoundingClientRect();
    act = {id:e.pointerId, ptype:e.pointerType, sec, rect, erase:isEraser(e), erased:[], lastPr:.5};
    if (act.erase) eraseAt(e);
    else {
      const hl = S.tool === 'hl';
      act.stroke = {t:hl ? 'hl' : 'pen', c:hl ? HL_COLOR : PENS[S.color], w:(hl ? HL_W : PEN_W)[S.size] / sec.W, p:[]};
      penStyle(sec.ctx, act.stroke);
      addPoint(e);
    }
  });
  const move = e => {
    if (!act || e.pointerId !== act.id) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (evs.length ? evs : [e]).forEach(ev => act.erase ? eraseAt(ev) : addPoint(ev));
  };
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', e => { if (act && e.pointerId === act.id) finish(); });
  cv.addEventListener('pointercancel', e => { if (act && e.pointerId === act.id) finish(); });
  cv.addEventListener('lostpointercapture', e => { if (act && e.pointerId === act.id) finish(); });
}

function addPoint(ev){
  const {sec, rect, stroke} = act, W = sec.W, p = stroke.p;
  const x = (ev.clientX - rect.left) / W, y = (ev.clientY - rect.top) / W;
  let pr = .5;
  if (ev.pointerType === 'pen') {
    pr = ev.pressure > 0 ? ev.pressure : act.lastPr;
    pr = act.lastPr * .45 + pr * .55;
    act.lastPr = pr;
  }
  const n = p.length / 3;
  if (n) {
    const dx = (x - p[(n-1)*3]) * W, dy = (y - p[(n-1)*3+1]) * W;
    if (dx * dx + dy * dy < .36) return;
  }
  p.push(x, y, pr);
  if (stroke.t === 'hl') {
    if (!frame) frame = requestAnimationFrame(() => {
      frame = 0;
      if (!act || !act.stroke) return;
      blit(act.sec); drawStroke(act.sec.ctx, act.stroke, act.sec.W);
    });
  } else if (n >= 1) piece(sec.ctx, stroke, p, n, W);
}

function eraseAt(ev){
  const {sec, rect} = act, W = sec.W;
  const x = (ev.clientX - rect.left) / W, y = (ev.clientY - rect.top) / W, r = 12 / W;
  const k = day.s[sec.id].k;
  let hit = false;
  for (let j = k.length - 1; j >= 0; j--) {
    if (hitStroke(k[j], x, y, r)) { act.erased.push({i:j, s:k[j]}); k.splice(j, 1); hit = true; }
  }
  if (hit) render(sec);
}
function hitStroke(s, x, y, r){
  const p = s.p, n = p.length / 3, rr = r + s.w / 2, r2 = rr * rr;
  for (let i = 0; i < n; i++) {
    const ax = p[i*3], ay = p[i*3+1];
    if (i === n - 1) { if ((x - ax) ** 2 + (y - ay) ** 2 <= r2) return true; continue; }
    const bx = p[(i+1)*3], by = p[(i+1)*3+1], dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L)) : 0;
    if ((x - ax - t * dx) ** 2 + (y - ay - t * dy) ** 2 <= r2) return true;
  }
  return false;
}

function finish(){
  const a = act; act = null;
  if (!a) return;
  const {sec} = a;
  if (a.erase) {
    if (a.erased.length) { pushUndo({t:'erase', id:sec.id, items:a.erased}); afterChange(sec); }
    return;
  }
  const s = a.stroke;
  if (!s.p.length) return;
  s.p = s.p.map((v, i) => i % 3 === 2 ? Math.round(v * 100) / 100 : Math.round(v * 1e4) / 1e4);
  day.s[sec.id].k.push(s);
  pushUndo({t:'add', id:sec.id, s});
  afterChange(sec);
}
function cancelAct(){ const sec = act.sec; act = null; render(sec); }
function afterChange(sec){ render(sec); updateProgress(); save(); }

/* ---------- undo / redo ---------- */
function pushUndo(a){ undoS.push(a); if (undoS.length > 200) undoS.shift(); redoS = []; syncUndo(); }
function syncUndo(){ $('#undo').disabled = !undoS.length; $('#redo').disabled = !redoS.length; }
function applyAction(a, back){
  if (a.t === 'page') { day = JSON.parse(JSON.stringify(back ? a.before : a.after)); renderAll(); save(); return; }
  const k = day.s[a.id].k;
  if (a.t === 'add') { if (back) { const i = k.indexOf(a.s); if (i > -1) k.splice(i, 1); } else k.push(a.s); }
  if (a.t === 'erase') {
    if (back) a.items.slice().reverse().forEach(it => k.splice(it.i, 0, it.s));
    else a.items.forEach(it => { const i = k.indexOf(it.s); if (i > -1) k.splice(i, 1); });
  }
  afterChange(secs[a.id]);
}
function undo(){ if (act) return; const a = undoS.pop(); if (!a) return; applyAction(a, true); redoS.push(a); syncUndo(); }
function redo(){ if (act) return; const a = redoS.pop(); if (!a) return; applyAction(a, false); undoS.push(a); syncUndo(); }
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z' || e.target.tagName === 'INPUT') return;
  e.preventDefault(); e.shiftKey ? redo() : undo();
});

/* ---------- tool bar ---------- */
function renderTools(){
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', S.tool === 'pen' && b.dataset.color === S.color));
  $('#tHl').setAttribute('aria-pressed', S.tool === 'hl');
  $('#tEr').setAttribute('aria-pressed', S.tool === 'eraser');
  document.querySelectorAll('.sz').forEach(b => b.setAttribute('aria-pressed', +b.dataset.size === S.size));
}
document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => { S.tool = 'pen'; S.color = b.dataset.color; saveSettings(); renderTools(); }));
document.querySelectorAll('.sz').forEach(b => b.addEventListener('click', () => { S.size = +b.dataset.size; if (S.tool === 'eraser') S.tool = 'pen'; saveSettings(); renderTools(); }));
$('#tHl').addEventListener('click', () => { S.tool = S.tool === 'hl' ? 'pen' : 'hl'; saveSettings(); renderTools(); });
$('#tEr').addEventListener('click', () => { S.tool = S.tool === 'eraser' ? 'pen' : 'eraser'; saveSettings(); renderTools(); });

function renderMode(){
  const pen = S.input === 'pen' || (S.input === 'auto' && S.penSeen);
  $('#modeChip').innerHTML = pen ? '<b>●</b> 펜 전용 · 손바닥 무시' : '<b>●</b> 터치펜 · 손가락 필기';
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === S.input));
  $('#modeHint').innerHTML = {
    auto: S.penSeen
      ? '액티브 펜이 감지되어 <b>펜으로만</b> 써져요. 손바닥이 닿아도 그려지지 않아요.'
      : '지금은 <b>터치펜·손가락</b>으로 써져요. 액티브 펜(전자펜)을 쓰면 자동으로 펜 전용으로 바뀌어요.',
    touch: '일반 <b>터치펜(정전식)</b>이나 손가락으로 써져요. 화면에 손바닥이 넓게 닿으면 무시해요. 쓸 때는 손을 살짝 띄워 주세요.',
    pen: '<b>액티브 펜</b>(전자펜)만 써져요. 손가락·손바닥은 모두 무시해요.'
  }[S.input];
}
$('#modeSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.input = b.dataset.mode;
  if (S.input === 'auto') S.penSeen = false;
  saveSettings(); renderMode();
});

/* ---------- header & date ---------- */
function renderHeader(){
  $('#dNum').textContent = `${cur.getMonth() + 1}.${pad(cur.getDate())}`;
  $('#dDow').textContent = DOW[cur.getDay()];
  $('#dSub').textContent = `${cur.getFullYear()} · ${DOW_EN[cur.getDay()]}`;
  const isToday = ymd(cur) === ymd(today0());
  $('#todayBtn').toggleAttribute('aria-current', isToday);
  if (isToday) $('#todayBtn').setAttribute('aria-current', 'date');
}
function go(d){
  if (act) return;
  saveNow();
  cur = new Date(d); cur.setHours(0, 0, 0, 0);
  day = loadDay(ymd(cur));
  undoS = []; redoS = []; syncUndo();
  renderAll();
}
function renderAll(){
  renderHeader();
  Object.values(secs).forEach(render);
  renderWake();
  updateProgress();
  const y = load(ymd(addDays(cur, -1)));
  ydBtn.hidden = !(y && y.s && y.s.tomorrow && y.s.tomorrow.k && y.s.tomorrow.k.length);
}
$('#prev').addEventListener('click', () => go(addDays(cur, -1)));
$('#next').addEventListener('click', () => go(addDays(cur, 1)));
$('#todayBtn').addEventListener('click', () => go(today0()));
$('#dateBtn').addEventListener('click', () => {
  const p = $('#datePick'); p.value = ymd(cur);
  try { p.showPicker(); } catch (e) { p.click(); }
});
$('#datePick').addEventListener('change', e => { if (e.target.value) go(new Date(e.target.value + 'T00:00')); });

/* ---------- 새벽기상 ---------- */
function wakeState(d){
  if (!d || !d.wake || !d.wake.actual) return '';
  return toMin(d.wake.actual) <= toMin(d.wake.target || S.target) ? 'ok' : 'late';
}
function renderWake(){
  const w = day.wake;
  $('#wTarget').value = w.target || '';
  $('#wActual').value = w.actual || '';
  $('#wNow').disabled = ymd(cur) !== ymd(today0());
  const res = $('#wRes');
  if (!w.actual) { res.className = 'wake-res'; res.innerHTML = '<b>기록 전</b>오늘도 상쾌하게'; }
  else {
    const diff = toMin(w.target) - toMin(w.actual);
    res.className = 'wake-res ' + (diff >= 0 ? 'ok' : 'late');
    res.innerHTML = diff > 0 ? `<b>목표 달성</b>${diff}분 일찍 일어났어요`
      : diff === 0 ? '<b>목표 달성</b>정시에 일어났어요' : `<b>${-diff}분 늦음</b>내일은 조금 더 일찍`;
  }
  // week (Mon–Sun) containing the shown date
  const mon = addDays(cur, -((cur.getDay() + 6) % 7)), key = ymd(cur);
  let h = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i), k = ymd(d), st = wakeState(k === key ? day : load(k));
    h += `<button class="wd ${st}${k === key ? ' sel' : ''}" data-d="${k}" aria-label="${d.getMonth() + 1}월 ${d.getDate()}일">${'월화수목금토일'[i]}<i></i></button>`;
  }
  $('#week').innerHTML = h;
  // streak of on-target mornings ending at the shown date
  let n = 0;
  for (let d = new Date(cur); n < 366; d = addDays(d, -1)) {
    const k = ymd(d);
    if (wakeState(k === key ? day : load(k)) !== 'ok') break;
    n++;
  }
  $('#streak').innerHTML = n ? `연속 <b>${n}</b>일` : '';
}
$('#week').addEventListener('click', e => { const b = e.target.closest('.wd'); if (b) go(new Date(b.dataset.d + 'T00:00')); });
$('#wTarget').addEventListener('change', e => {
  if (!e.target.value) return;
  day.wake.target = S.target = e.target.value; saveSettings(); save(); renderWake();
});
$('#wActual').addEventListener('change', e => { day.wake.actual = e.target.value; save(); renderWake(); });
$('#wNow').addEventListener('click', () => {
  const n = new Date(); day.wake.actual = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  save(); renderWake();
  toast(wakeState(day) === 'ok' ? '좋은 아침이에요! 목표 달성 🌅' : '좋은 아침이에요!');
});

/* ---------- 어제 적은 일 ---------- */
function showYesterday(){
  const y = loadDay(ymd(addDays(cur, -1))), k = y.s.tomorrow.k;
  const W = secs.tomorrow.W || 300;
  let maxY = 0;
  k.forEach(s => { for (let i = 1; i < s.p.length; i += 3) maxY = Math.max(maxY, s.p[i] * W); });
  const H = Math.max(LH * 3, Math.ceil((maxY + 8) / LH) * LH);
  const cv = $('#ydCanvas'), r = dpr();
  cv.width = Math.round(W * r); cv.height = Math.round(H * r);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  $('#ydSheet').style.width = W + 'px';
  paint(cv.getContext('2d'), cv, k, W);
  $('#yd').showModal();
}

/* ---------- menu ---------- */
$('#menuBtn').addEventListener('click', () => { renderMode(); $('#menu').showModal(); });
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
});
$('#fsBtn').addEventListener('click', () => {
  const de = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (de.requestFullscreen) de.requestFullscreen().catch(() => toast('이 브라우저에서는 전체 화면을 쓸 수 없어요.'));
  $('#menu').close();
});
$('#clearBtn').addEventListener('click', () => {
  if (!confirm(`${cur.getMonth() + 1}월 ${cur.getDate()}일 페이지를 모두 비울까요?\n(실행 취소로 되돌릴 수 있어요)`)) return;
  const before = JSON.parse(JSON.stringify(day)), after = emptyDay();
  after.wake.target = day.wake.target;
  pushUndo({t:'page', before, after});
  day = JSON.parse(JSON.stringify(after));
  renderAll(); save(); $('#menu').close();
});
$('#expBtn').addEventListener('click', () => {
  saveNow();
  const out = {app:'daily-planner', v:1, settings:S, days:{}};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (/^dp:\d{4}-\d{2}-\d{2}$/.test(k)) out.days[k.slice(3)] = JSON.parse(localStorage.getItem(k));
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], {type:'application/json'}));
  a.download = `planner-backup-${ymd(today0())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${Object.keys(out.days).length}일치 기록을 저장했어요.`);
});
$('#impBtn').addEventListener('click', () => $('#impFile').click());
$('#impFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (data.app !== 'daily-planner' || !data.days) throw new Error('format');
    const keys = Object.keys(data.days).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k));
    if (!confirm(`${keys.length}일치 기록을 불러올까요?\n같은 날짜의 기존 기록은 덮어써져요.`)) return;
    keys.forEach(k => store(k, data.days[k]));
    day = loadDay(ymd(cur)); undoS = []; redoS = []; syncUndo();
    renderAll(); $('#menu').close(); toast('백업을 불러왔어요.');
  } catch (err) { toast('백업 파일을 읽을 수 없어요.'); }
});

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ---------- lifecycle ---------- */
let shownToday = ymd(today0());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { saveNow(); return; }
  const t = ymd(today0());
  if (t !== shownToday) { const wasToday = ymd(cur) === shownToday; shownToday = t; if (wasToday) go(today0()); else renderHeader(); }
});
window.addEventListener('pagehide', saveNow);
document.addEventListener('gesturestart', e => e.preventDefault());

day = loadDay(ymd(cur));
renderTools(); renderMode(); renderAll();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
